name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and CI tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff==0.9.10
      - name: Lint
        run: ruff check src scripts tests --select E9,F63,F7,F82 --output-format=concise
      - name: Test
        run: pytest -q
      - name: Docker build
        run: docker build --tag constituency-insights-api:ci .
