[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constituency-insights"
version = "0.1.0"
description = "Research tools for political stance classification and election-outcome modeling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "matplotlib>=3.8",
    "mlflow>=3.0",
    "optuna>=4.0",
    "pandas>=2.1",
    "peft>=0.18",
    "PyYAML>=6.0",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.3",
    "shap>=0.45",
    "statsmodels>=0.14",
    "sentence-transformers>=5.0",
    "bertopic>=0.17",
    "xgboost>=2.0",
    "uvicorn==0.54.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
transformer = [
    "transformers==5.22.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
